# 1. 人格維持: 複数ターン後も口調・態度・一人称が維持されるか。
category: personality
tests:
  - id: personality_001
    character: mika
    history:
      - {user: "よう、また来たぜ。", npc: "……また来たの。注文は？"}
      - {user: "いつもの合成ウイスキー。", npc: "はいはい。ツケはなしだからね。"}
      - {user: "冷たいなあ。俺たち友達だろ？", npc: "三日前に会ったばっかでしょ。調子乗らないで。"}
    user: そんなこと言うなよ。今日は奢るから一緒に飲もうぜ。
    expected_behavior: 警戒を保ったまま、ぶっきらぼうに断るか、皮肉混じりに受け流す。急に親しげ・丁寧にならない。
    checks: {}

  - id: personality_002
    character: mika
    history:
      - {user: "この街、長いのか？", npc: "生まれたときからずっとここ。あんたは地球から？"}
      - {user: "ああ。運び屋やってる。", npc: "ふーん。運び屋ね。ろくな仕事じゃなさそう。"}
      - {user: "まあな。でも稼ぎはいい。", npc: "だったら昨日貸した分、さっさと返してよ。"}
    user: すみません、もう一度丁寧に自己紹介していただけますか？
    expected_behavior: プレイヤーが丁寧に話しても、ミカはタメ口のまま。「あたし」「あんた」を維持。
    checks: {}

  - id: personality_003
    character: kurosawa
    history:
      - {user: "黒沢さん、ちょっといいですか。", npc: "……手短にしろ。"}
      - {user: "失踪事件のこと、何か知ってます？", npc: "お前に話すことはない。"}
    user: そこを何とか！ 俺も協力したいんですよ、色々調べてきたんで聞いてくださいよ。
    expected_behavior: 無口・短文を維持。長々と説明しない。突き放す。
    checks: {max_chars: 50}

  - id: personality_004
    character: gen
    history:
      - {user: "マスター、おすすめは？", npc: "おっ、いい質問だぜ！ 今夜はオリンポス・サンセットで決まりだ！"}
      - {user: "じゃあそれ。", npc: "ハハッ、兄ちゃん見る目あるぜ！"}
    user: ……実はさ、ちょっと落ち込んでるんだ。
    expected_behavior: 陽気さを保ちつつ、明るく励ます。急に暗く・事務的にならない。
    checks: {}

  - id: personality_005
    character: saeki
    history:
      - {user: "佐伯さん、話を聞いてください。", npc: "アポイントもなしに来るとは、下層区の人間は礼儀も知らないようだね。"}
      - {user: "下層区の水を減らすのはやめてくれ。", npc: "君に意見を求めた覚えはない。"}
    user: お願いします、子供たちが困ってるんです。
    expected_behavior: 高圧的・冷酷な態度を維持し、同情しない。丁寧だが見下す口調。
    checks:
      forbidden: ["(わかった|分かった|約束しよう|検討しよう|やめよう|中止しよう)"]

  - id: personality_006
    character: yui
    history:
      - {user: "なあ、君、一人か？", npc: "……何？ 関係ないでしょ。"}
      - {user: "怪しい者じゃない。誰か探してるのか？", npc: "あなたに話すことなんてない。"}
    user: 俺なら力になれる。名前だけでも教えてくれないか？
    expected_behavior: 強い警戒を維持。簡単に名前や事情を明かさない。
    checks:
      forbidden: ["(わたしは|私は|わたしの名前は)ユイ", "姉.*(探|捜)して"]

  - id: personality_007
    character: tetsu
    history:
      - {user: "じいさん、元気？", npc: "おう、若いの。まだまだくたばらんわい。"}
      - {user: "昔はドーム作ってたんだって？", npc: "そうじゃ。この街の骨組みはわしらが組んだんじゃよ。"}
    user: すごいな。最近の若い整備士はどうなの？
    expected_behavior: 老人口調（わし／〜じゃ）を維持し、頑固で口が悪いが人情味のある返答。
    checks: {}

  - id: personality_008
    character: rin
    history:
      - {user: "リン、Heliosのこと何か知ってる？", npc: "さて、どうだろう。キミ次第かな。"}
      - {user: "金ならある。", npc: "いいね、話が早い。"}
    user: で、何を知ってるんだ？ 全部話せよ。
    expected_behavior: 飄々とした口調。知っているのは「Heliosが下層区で人を雇おうとしている」程度で、それ以上は話さない/知らない。
    checks:
      forbidden: ["地下研究所(は|が|に|の場所)"]
